server {
    listen 80;
    root /usr/share/nginx/html;

    # По умолчанию nginx пропускает тела запросов до 1 МБ, а тезисы могут быть до 5 МБ
    client_max_body_size 6m;

    # Запросы к API отправить бэкенду (имя "backend" задано в docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Всё остальное: файлы сайта; незнакомые адреса (например, /applications/new)
    # открывают главную страницу, дальше маршрутизацию делает React Router
    location / {
        try_files $uri /index.html;
    }
}